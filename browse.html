<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>

<script>
/* ── Config ── */
const RESULTS_PER_PAGE = 12;
const FETCH_BATCH      = 50;

/* ── State ── */
let currentPage       = 1;
let totalPages        = 1;
let allResults        = [];
let filteredResults   = [];
let continueParams    = null;
let isFetching        = false;
let currentQuery      = "";
/* tracks which gsrfiletype was used in the last API fetch so we
   know whether a type-filter change requires a new network request */
let activeApiFilter   = null; // null | "audio" | "video"

/* ── DOM Refs ── */
const form           = document.getElementById("searchForm");
const resultsEl      = document.getElementById("results");
const statusEl       = document.getElementById("status");
const paginationWrap = document.getElementById("paginationWrap");
const pageIndicator  = document.getElementById("pageIndicator");
const paginationEl   = document.getElementById("pagination");
const loadMoreWrap   = document.getElementById("loadMoreWrap");
const loadMoreBtn    = document.getElementById("loadMoreBtn");

/* ════════════════════════════════════════════
   SECURITY UTILITIES
   ════════════════════════════════════════════ */

function sanitizeUrl(url) {
  if (!url) return "";
  const s = String(url).trim();
  return /^https?:\/\//i.test(s) ? s : "";
}

function sanitizeMime(mime) {
  if (!mime) return "";
  const s = String(mime).toLowerCase().trim();
  return /^(image|audio|video)\//.test(s) ? s : "";
}

function stripHtml(html) {
  if (!html) return "";
  const div = document.createElement("div");
  div.innerHTML = html;
  return (div.textContent || div.innerText || "").trim();
}

function safeText(s) { return (s || "").replace(/\s+/g, " ").trim(); }

function safeHtml(s) {
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function getExt(meta, key) {
  return meta && meta[key] ? stripHtml(meta[key].value) : "";
}

/* Extract year only from date string for card display */
function formatDate(d) {
  const match = (d || "").match(/\b(1\d{3}|20\d{2})\b/);
  return match ? match[1] : "";
}

/* ════════════════════════════════════════════
   API FETCH
   gsrfiletype: null = all types, "audio", "video"
   Images dominate unrestricted results so "image" stays client-side only.
   ════════════════════════════════════════════ */

async function fetchBatch(query, cont = null, gsrfiletype = null) {
  const url = new URL("https://commons.wikimedia.org/w/api.php");
  url.searchParams.set("origin",       "*");
  url.searchParams.set("format",       "json");
  url.searchParams.set("action",       "query");
  url.searchParams.set("generator",    "search");
  url.searchParams.set("gsrsearch",    query);
  url.searchParams.set("gsrnamespace", "6");
  url.searchParams.set("gsrlimit",     String(FETCH_BATCH));
  url.searchParams.set("gsrsort",      "relevance");
  url.searchParams.set("prop",         "imageinfo|categories|info");
  url.searchParams.set("iiprop",       "url|extmetadata|mime|size");
  url.searchParams.set("cllimit",      "15");
  url.searchParams.set("inprop",       "url");

  /* Thumbnail width only helps for images; skip for audio to avoid API noise */
  if (gsrfiletype !== "audio") {
    url.searchParams.set("iiurlwidth", "520");
  }

  if (gsrfiletype) {
    url.searchParams.set("gsrfiletype", gsrfiletype);
  }

  if (cont) {
    Object.entries(cont).forEach(([k, v]) => url.searchParams.set(k, String(v)));
  }

  const resp = await fetch(url.toString());
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  return resp.json();
}

/* Map UI type value → gsrfiletype parameter (null = no server filter) */
function apiFilterFor(type) {
  if (type === "audio") return "audio";
  if (type === "video") return "video";
  return null; // "all" and "image" handled client-side
}

/* ════════════════════════════════════════════
   DUBLIN CORE METADATA EXTRACTION
   ════════════════════════════════════════════ */

const MIME_MEDIUM = {
  "image/jpeg": "JPEG image",   "image/jpg":  "JPEG image",
  "image/png":  "PNG image",    "image/gif":  "GIF image",
  "image/svg+xml": "SVG graphic", "image/tiff": "TIFF image",
  "image/webp": "WebP image",
  "audio/ogg":  "OGG audio",    "audio/mpeg": "MP3 audio",
  "audio/wav":  "WAV audio",    "audio/flac": "FLAC audio",
  "audio/x-flac": "FLAC audio",
  "video/webm": "WebM video",   "video/mp4":  "MP4 video",
  "video/ogg":  "OGG video"
};

const MIME_DCTYPE = {
  "image/": "Image",
  "audio/": "Sound",
  "video/": "MovingImage"
};

function extractDC(page) {
  const info = page.imageinfo[0];
  const meta = info.extmetadata || {};

  const categories = (page.categories || []).map(c =>
    safeText(c.title.replace(/^Category:/, ""))
  );

  const fileName = safeText(page.title || "")
    .replace(/^File:/, "")
    .replace(/\.[^/.]+$/, "")
    .replace(/_/g, " ");

  const rawTitle       = safeText(getExt(meta, "ObjectName"));
  const rawDescription = safeText(getExt(meta, "ImageDescription"));

  const title        = rawTitle;                               // dc:title — ObjectName only
  const displayTitle = rawTitle || rawDescription || fileName; // card heading

  const creator     = safeText(getExt(meta, "Artist"));
  const contributor = safeText(getExt(meta, "Credit"));
  const description = rawDescription;

  const dateCreated  = safeText(getExt(meta, "DateTimeOriginal"));
  const dateModified = safeText(getExt(meta, "DateTime"));
  const date         = dateCreated || dateModified;

  const licenseShort = safeText(getExt(meta, "LicenseShortName"));
  const licenseUrl   = sanitizeUrl(safeText(getExt(meta, "LicenseUrl")));
  const usageTerms   = safeText(getExt(meta, "UsageTerms"));

  const attrRequired = safeText(getExt(meta, "AttributionRequired"));
  const permissions  = safeText(getExt(meta, "Permission"));
  const restrictions = safeText(getExt(meta, "Restrictions"));
  const accessRights = [
    attrRequired === "true" ? "Attribution required" : "",
    permissions,
    restrictions
  ].filter(Boolean).join("; ");

  const language = safeText(getExt(meta, "Language"));

  const gpsLat = safeText(getExt(meta, "GPSLatitude"));
  const gpsLon = safeText(getExt(meta, "GPSLongitude"));
  const spatial = (gpsLat && gpsLon) ? `${gpsLat}, ${gpsLon}` : "";

  const mimeType   = sanitizeMime(info.mime);
  const fileSizeKb = info.size ? `${(info.size / 1024).toFixed(1)} KB` : "";
  const dims       = (info.width && info.height) ? `${info.width} × ${info.height} px` : "";
  const extent     = [dims, fileSizeKb].filter(Boolean).join("; ");

  const dcType = Object.entries(MIME_DCTYPE).find(([k]) => mimeType.startsWith(k))?.[1] || "Dataset";
  const medium = MIME_MEDIUM[mimeType] || mimeType;

  const pageUrl    = sanitizeUrl(page.fullurl || "");
  const fileUrl    = sanitizeUrl(info.url || "");
  const subject    = categories.length ? categories.join("; ") : "";
  const rights     = usageTerms || licenseShort;
  const identifier = page.pageid ? String(page.pageid) : "";

  return {
    title, displayTitle,
    creator, contributor, description, subject,
    date, dateModified: (dateModified && dateModified !== date) ? dateModified : "",
    type: dcType, format: mimeType, medium, extent,
    publisher: "Wikimedia Commons",
    source: pageUrl || fileUrl,
    identifier, language, spatial, rights, licenseUrl, accessRights,
    assetPage: pageUrl,
    _mimeType:     mimeType,
    _licenseShort: licenseShort
  };
}

/* ════════════════════════════════════════════
   METADATA PANEL HTML
   ════════════════════════════════════════════ */

function buildMetadataRows(dc) {
  const rows = [
    { term: "dc:title",             label: "Title",            value: dc.title },
    { term: "dc:creator",           label: "Creator",          value: dc.creator },
    { term: "dc:contributor",       label: "Contributor",      value: dc.contributor },
    { term: "dc:description",       label: "Description",      value: dc.description },
    { term: "dc:subject",           label: "Subject",          value: dc.subject },
    { term: "dc:date",              label: "Date",             value: dc.date },
    { term: "dcterms:modified",     label: "Modified",         value: dc.dateModified },
    { term: "dc:type",              label: "Type",             value: dc.type },
    { term: "dc:format",            label: "Format",           value: dc.format },
    { term: "dcterms:medium",       label: "Medium",           value: dc.medium },
    { term: "dcterms:extent",       label: "Extent",           value: dc.extent },
    { term: "dc:publisher",         label: "Publisher",        value: dc.publisher },
    { term: "dc:source",            label: "Source",           value: dc.source,     isUrl: true },
    { term: "dc:identifier",        label: "Identifier",       value: dc.identifier },
    { term: "dc:language",          label: "Language",         value: dc.language },
    { term: "dcterms:spatial",      label: "Spatial Coverage", value: dc.spatial },
    { term: "dc:rights",            label: "Rights",           value: dc.rights },
    { term: "dcterms:license",      label: "License",          value: dc.licenseUrl, isUrl: true },
    { term: "dcterms:accessRights", label: "Access Rights",    value: dc.accessRights },
    { term: "—",                    label: "Asset Page",       value: dc.assetPage,  isUrl: true }
  ];

  return rows
    .filter(r => r.value && String(r.value).trim())
    .map(r => {
      const isUrl = r.isUrl || /^https?:\/\//i.test(r.value);
      let displayVal;
      if (isUrl) {
        const safe  = safeHtml(r.value);
        const label = r.value.length > 55 ? safeHtml(r.value.slice(0, 55) + "…") : safe;
        displayVal  = `<a href="${safe}" target="_blank" rel="noopener noreferrer">${label}</a>`;
      } else {
        displayVal = safeHtml(r.value);
      }
      return `<div class="dc-row">
        <span class="dc-term" title="${safeHtml(r.term)}">${safeHtml(r.label)}</span>
        <span class="dc-value">${displayVal}</span>
      </div>`;
    })
    .join("");
}

/* ════════════════════════════════════════════
   MEDIA ELEMENT
   ════════════════════════════════════════════ */

function renderMediaElement(info, displayTitle) {
  const mimeType = sanitizeMime(info.mime);
  const mediaUrl = sanitizeUrl(info.url);
  const thumbUrl = sanitizeUrl(info.thumburl) || mediaUrl;
  const altText  = safeHtml(displayTitle || "Media asset");

  if (!mimeType) {
    return `<div class="asset-audio-wrap">
      <span style="color:var(--color-text-muted);font-size:.875rem">Unsupported format</span>
    </div>`;
  }

  if (mimeType.startsWith("audio/")) {
    return `<div class="asset-audio-wrap">
      <audio controls aria-label="${altText}">
        <source src="${safeHtml(mediaUrl)}" type="${safeHtml(mimeType)}">
        Your browser does not support audio. <a href="${safeHtml(sanitizeUrl(info.descriptionurl || ""))}" target="_blank" rel="noopener noreferrer">View on Wikimedia</a>.
      </audio>
    </div>`;
  }

  if (mimeType.startsWith("video/")) {
    return `<video controls class="asset-thumb" aria-label="${altText}">
      <source src="${safeHtml(mediaUrl)}" type="${safeHtml(mimeType)}">
      Your browser does not support video. <a href="${safeHtml(sanitizeUrl(info.descriptionurl || ""))}" target="_blank" rel="noopener noreferrer">View on Wikimedia</a>.
    </video>`;
  }

  return `<img src="${safeHtml(thumbUrl)}" class="asset-thumb" alt="${altText}" loading="lazy">`;
}

/* ════════════════════════════════════════════
   RENDERABLE CHECK
   ════════════════════════════════════════════ */

function isRenderable(page) {
  if (!page?.imageinfo?.[0]) return false;
  const info     = page.imageinfo[0];
  const mime     = sanitizeMime(info.mime);
  const mediaUrl = sanitizeUrl(info.url);
  const thumbUrl = sanitizeUrl(info.thumburl);
  if (mime.startsWith("audio/")) return !!mediaUrl;
  if (mime.startsWith("video/")) return !!mediaUrl;
  if (mime.startsWith("image/")) return !!(thumbUrl || mediaUrl);
  return false;
}

/* ════════════════════════════════════════════
   RENDER PAGE OF RESULTS
   ════════════════════════════════════════════ */

function renderPage(page) {
  resultsEl.innerHTML = "";

  const start = (page - 1) * RESULTS_PER_PAGE;
  const slice = filteredResults.slice(start, start + RESULTS_PER_PAGE);

  if (!slice.length) {
    statusEl.textContent = "No results match the current filters.";
    paginationWrap.hidden = true;
    return;
  }

  const badgeLabel = { Image: "IMAGE", Sound: "AUDIO", MovingImage: "VIDEO" };

  slice.forEach((p, idx) => {
    const dc      = p._dc;
    const info    = p.imageinfo[0];
    const badge   = badgeLabel[dc.type] || dc.type.toUpperCase();
    const panelId = `meta-${p.pageid || (start + idx)}`;
    const dateStr = formatDate(dc.date);

    const col = document.createElement("article");
    col.className = "asset-card";

    col.innerHTML = `
      ${renderMediaElement(info, dc.displayTitle)}
      <div class="asset-body">
        <span class="asset-badge" aria-hidden="true">${safeHtml(badge)}</span>
        <h3 class="asset-title">${safeHtml(dc.displayTitle || "Untitled")}</h3>
        ${dateStr ? `<p class="asset-date">${safeHtml(dateStr)}</p>` : ""}
        <button class="metadata-toggle" type="button"
          aria-expanded="false" aria-controls="${panelId}">
          <span class="toggle-arrow" aria-hidden="true">&#9654;</span>
          View Record
        </button>
        <div class="metadata-panel" id="${panelId}" hidden>
          ${buildMetadataRows(dc)}
        </div>
      </div>
    `;

    resultsEl.appendChild(col);
  });
}

/* Single delegated listener for all metadata toggles */
resultsEl.addEventListener("click", e => {
  const btn = e.target.closest(".metadata-toggle");
  if (!btn) return;
  const panel    = document.getElementById(btn.getAttribute("aria-controls"));
  if (!panel) return;
  const expanded = btn.getAttribute("aria-expanded") === "true";
  btn.setAttribute("aria-expanded", String(!expanded));
  panel.hidden   = expanded;
});

/* ════════════════════════════════════════════
   STATUS TEXT
   ════════════════════════════════════════════ */

function updateStatus() {
  const total = filteredResults.length;
  if (!total) return;
  const start     = (currentPage - 1) * RESULTS_PER_PAGE + 1;
  const end       = Math.min(start + RESULTS_PER_PAGE - 1, total);
  const moreAvail = continueParams ? " — more results available" : "";
  statusEl.textContent = `Showing ${start}–${end} of ${total} results${moreAvail}`;
}

/* ════════════════════════════════════════════
   FILTERS (client-side: license + sort + image subtype)
   ════════════════════════════════════════════ */

function applyFilters() {
  const mediaType = document.querySelector('input[name="mediaType"]:checked')?.value || "all";
  const license   = document.getElementById("licenseFilter").value.toLowerCase();
  const sort      = document.getElementById("sortOrder").value;

  filteredResults = allResults.filter(p => {
    const dc = p._dc;
    if (mediaType === "image" && !dc._mimeType.startsWith("image/"))  return false;
    if (mediaType === "audio" && !dc._mimeType.startsWith("audio/"))  return false;
    if (mediaType === "video" && !dc._mimeType.startsWith("video/"))  return false;
    if (license && !dc._licenseShort.toLowerCase().includes(license) &&
        !dc.rights.toLowerCase().includes(license)) return false;
    return true;
  });

  if (sort === "date_desc" || sort === "date_asc") {
    filteredResults.sort((a, b) => {
      const da = a._dc.date || "", db = b._dc.date || "";
      if (!da && !db) return 0;
      if (!da) return 1;
      if (!db) return -1;
      return sort === "date_desc" ? db.localeCompare(da) : da.localeCompare(db);
    });
  }

  currentPage = 1;
  totalPages  = Math.ceil(filteredResults.length / RESULTS_PER_PAGE) || 1;

  renderPage(currentPage);
  renderPagination();
  updateStatus();
}

/* ════════════════════════════════════════════
   TYPE FILTER — re-fetches server-side for audio / video
   ════════════════════════════════════════════ */

async function refetchForType(newType) {
  if (isFetching || !currentQuery) return;

  const needed = apiFilterFor(newType);

  if (needed === activeApiFilter) {
    /* Same server-side filter — just re-apply client-side filtering */
    applyFilters();
    return;
  }

  isFetching     = true;
  activeApiFilter = needed;
  allResults      = [];
  filteredResults = [];
  continueParams  = null;
  currentPage     = 1;

  resultsEl.innerHTML   = "";
  paginationWrap.hidden = true;
  loadMoreWrap.hidden   = true;
  statusEl.textContent  = "Searching…";

  try {
    const data     = await fetchBatch(currentQuery, null, needed);
    const pagesObj = data?.query?.pages;

    if (pagesObj) {
      const batch = Object.values(pagesObj).filter(isRenderable);
      batch.forEach(p => { p._dc = extractDC(p); });
      allResults = batch;
    }

    continueParams      = data?.continue || null;
    loadMoreWrap.hidden = !continueParams;

    if (!allResults.length) {
      const label = newType === "all" ? "media" : newType;
      statusEl.textContent = `No ${label} assets found for "${currentQuery}".`;
      return;
    }

    applyFilters();
  } catch (err) {
    statusEl.textContent = `Error: ${safeHtml(err.message)}`;
  } finally {
    isFetching = false;
  }
}

document.querySelectorAll('input[name="mediaType"]').forEach(r =>
  r.addEventListener("change", () => {
    const newType = document.querySelector('input[name="mediaType"]:checked')?.value || "all";
    refetchForType(newType);
  })
);

document.getElementById("licenseFilter").addEventListener("change", applyFilters);
document.getElementById("sortOrder").addEventListener("change", applyFilters);

/* ════════════════════════════════════════════
   PAGINATION
   ════════════════════════════════════════════ */

function createPageItem(label, page, disabled = false, active = false) {
  const li  = document.createElement("li");
  li.className = `page-item${disabled ? " disabled" : ""}${active ? " active" : ""}`;

  const btn = document.createElement("button");
  btn.className   = "page-link";
  btn.type        = "button";
  btn.textContent = label;

  if (active)   btn.setAttribute("aria-current", "page");
  if (disabled) btn.setAttribute("aria-disabled", "true");
  if (label === "Previous") btn.setAttribute("aria-label", "Go to previous page");
  if (label === "Next")     btn.setAttribute("aria-label", "Go to next page");

  if (!disabled && !active) btn.addEventListener("click", () => goToPage(page));

  li.appendChild(btn);
  return li;
}

function createEllipsis() {
  const li = document.createElement("li");
  li.className = "page-item disabled";
  li.setAttribute("aria-hidden", "true");
  li.innerHTML = `<span class="page-link">…</span>`;
  return li;
}

function renderPagination() {
  paginationEl.innerHTML = "";

  if (totalPages <= 1) { paginationWrap.hidden = true; return; }

  paginationWrap.hidden = false;
  pageIndicator.textContent = `Page ${currentPage} of ${totalPages}`;

  paginationEl.appendChild(createPageItem("Previous", currentPage - 1, currentPage === 1));

  let s = Math.max(1, currentPage - 2);
  let e = Math.min(totalPages, currentPage + 2);
  if (currentPage <= 3)              e = Math.min(totalPages, 5);
  if (currentPage >= totalPages - 2) s = Math.max(1, totalPages - 4);

  if (s > 1) {
    paginationEl.appendChild(createPageItem("1", 1, false, currentPage === 1));
    if (s > 2) paginationEl.appendChild(createEllipsis());
  }

  for (let i = s; i <= e; i++) {
    paginationEl.appendChild(createPageItem(String(i), i, false, i === currentPage));
  }

  if (e < totalPages) {
    if (e < totalPages - 1) paginationEl.appendChild(createEllipsis());
    paginationEl.appendChild(createPageItem(String(totalPages), totalPages, false, currentPage === totalPages));
  }

  paginationEl.appendChild(createPageItem("Next", currentPage + 1, currentPage === totalPages));
}

function goToPage(page) {
  if (page < 1 || page > totalPages) return;
  currentPage = page;
  renderPage(currentPage);
  renderPagination();
  updateStatus();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ════════════════════════════════════════════
   LOAD MORE
   ════════════════════════════════════════════ */

async function loadMore() {
  if (isFetching || !continueParams) return;
  isFetching = true;
  loadMoreBtn.disabled    = true;
  loadMoreBtn.textContent = "Loading…";
  loadMoreBtn.setAttribute("aria-busy", "true");

  try {
    /* Continue with same server-side filter that was used for initial fetch */
    const data     = await fetchBatch(currentQuery, continueParams, activeApiFilter);
    const pagesObj = data?.query?.pages;

    if (pagesObj) {
      const batch = Object.values(pagesObj).filter(isRenderable);
      batch.forEach(p => { p._dc = extractDC(p); });
      allResults = [...allResults, ...batch];
    }

    continueParams      = data?.continue || null;
    loadMoreWrap.hidden = !continueParams;

    applyFilters();
  } catch (err) {
    statusEl.textContent = `Error loading more results: ${safeHtml(err.message)}`;
  } finally {
    isFetching = false;
    if (continueParams) {
      loadMoreBtn.disabled    = false;
      loadMoreBtn.textContent = "Load more results";
      loadMoreBtn.removeAttribute("aria-busy");
    }
  }
}

loadMoreBtn.addEventListener("click", loadMore);

/* ════════════════════════════════════════════
   SEARCH SUBMIT
   ════════════════════════════════════════════ */

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const query = document.getElementById("q").value.trim();
  if (!query) return;

  currentQuery    = query;
  allResults      = [];
  filteredResults = [];
  continueParams  = null;
  isFetching      = false;
  currentPage     = 1;
  totalPages      = 1;

  /* Honour whatever type pill is currently selected */
  const selectedType = document.querySelector('input[name="mediaType"]:checked')?.value || "all";
  activeApiFilter    = apiFilterFor(selectedType);

  resultsEl.innerHTML    = "";
  paginationWrap.hidden  = true;
  loadMoreWrap.hidden    = true;
  paginationEl.innerHTML = "";
  statusEl.textContent   = "Searching…";

  try {
    const data     = await fetchBatch(query, null, activeApiFilter);
    const pagesObj = data?.query?.pages;

    if (!pagesObj) {
      statusEl.textContent = "No results found.";
      return;
    }

    const batch = Object.values(pagesObj).filter(isRenderable);
    batch.forEach(p => { p._dc = extractDC(p); });
    allResults = batch;

    continueParams      = data?.continue || null;
    loadMoreWrap.hidden = !continueParams;

    if (!allResults.length) {
      statusEl.textContent = "No usable media assets found for that query.";
      return;
    }

    applyFilters();
  } catch (err) {
    statusEl.textContent = `Search error: ${safeHtml(err.message)}`;
  }
});
</script>
